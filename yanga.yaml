feature_model:
  description: SPLed product features
  file: KConfig
  pipeline:
  - step: KConfigEdit
    module: yanga_core.steps.kconfig_edit
pipeline:
  install:
  # The env script is not part of the fragment: a platform may need to publish
  # variables before it is written (see pipeline/zephyr.yaml).
  - include: pipeline/bootstrap.yaml
  - step: GenerateEnvSetupScript
    module: pypeline.steps.env_setup_script
  gen:
  - step: KConfigGen
    module: yanga_core.steps.kconfig_gen
  build:
  - step: GenerateBuildSystemFiles
    module: yanga.cmake.steps
  - step: GenerateReportConfig
    module: yanga_core.steps.generate_report_config
  - step: ExecuteBuild
    module: yanga.cmake.steps
configs:
  - id: poks
    file: poks.json
