name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

  workflow_dispatch:

jobs:
  test-windows:
    name: Test ${{ matrix.variant }} (Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Disco
            tests: Test_Disco and not zephyr_sim and not waveshare
          - variant: Sleep
            tests: Test_Sleep and gtest
          - variant: Spa
            tests: Test_Spa and (gtest or arduino_uno_r3)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Installation of Dependencies and Execute Tests for ${{ matrix.variant }}
        run: |
          .\build.ps1 -install
          pytest -k "${{ matrix.tests }}"
        shell: powershell

  test-unix:
    name: Test ${{ matrix.variant }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            variant: Disco
            tests: Test_Disco and not zephyr_sim and not waveshare
          - os: ubuntu-latest
            variant: Sleep
            tests: Test_Sleep and gtest
          - os: ubuntu-latest
            variant: Spa
            tests: Test_Spa and (gtest or arduino_uno_r3)
          - os: macos-latest
            variant: Disco
            tests: Test_Disco and gtest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - name: Install pypeline runner
        run: pip install pypeline-runner>=1.23
        shell: bash
      - name: Run pypeline
        run: pypeline run --config-file yanga.yaml --step CreateVEnv --single
        shell: bash
      - name: Execute Tests for ${{ matrix.variant }}
        run: .venv/bin/python -m pytest -k "${{ matrix.tests }}"
        shell: bash
