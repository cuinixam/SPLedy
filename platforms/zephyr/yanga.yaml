components:
  # The Zephyr-side adapters behind the same led_interface / button_interface
  # seam the Arduino and TC375 adapters use. main.c stays in app.cmake: Zephyr
  # requires at least one source on its `app` library.
  - name: zephyr_adapters
    path: platforms/zephyr/app/src
    sources:
    - button_adapter.c
    - buttons_shell.c
    required_components:
    - platform_types
    - rte
    - button_interface

  # One LED adapter per board, picked by the platform: an RGB LED on a data
  # line goes through led_strip, a plain on/off LED through gpio.
  - name: zephyr_led_gpio
    path: platforms/zephyr/app/src
    sources:
    - led_adapter.c
    required_components:
    - platform_types
    - rte
    - led_interface

  - name: zephyr_led_ws2812
    path: platforms/zephyr/app/src
    sources:
    - led_adapter_ws2812.c
    required_components:
    - platform_types
    - rte
    - led_interface

platforms:
  # Zephyr drives the build; yanga contributes the variant as a generated CMake
  # fragment (variant.cmake) that platforms/zephyr/app/CMakeLists.txt includes.
  # One platform per board: the board is Zephyr's concept and appears only in
  # the ZephyrBuild step's config.
  - name: zephyr_sim
    description: Zephyr native_sim, host compiler (Linux only)
    # Zephyr's own Kconfig tree is the platform's feature model, opened by Zephyr's editor
    # (yanga's KConfigEdit cannot load it). The variant's selection for this platform is the
    # file the editor's changes are written into, and a build merges it as an EXTRA_CONF_FILE.
    feature_model:
      description: Zephyr options for zephyr_sim
      file: KConfig
      pipeline:
        - include: pipeline/zephyr.yaml
        - step: ZephyrFeatures
          file: platforms/zephyr/steps.py
          config: &zephyr_sim_config
            board: native_sim/native/64
            toolchain: host
    build_targets: [all, flash, report]
    components: [platform_types, zephyr_adapters, zephyr_led_gpio]
    configs:
      - id: west
        file: platforms/zephyr/west.yaml
      - id: poks
        file: platforms/zephyr/poks.json
      # Included by the root CMakeLists.txt before project(): find_package(Zephyr).
      - id: vars
        content:
          PLATFORM_CMAKE_SETUP: platforms/zephyr/zephyr.cmake
      # Included at the end of variant.cmake: the adapters and Zephyr-side settings.
      - id: cmake
        file: platforms/zephyr/app.cmake
    generators:
      - step: ZephyrCMakeGenerator
        file: platforms/zephyr/steps.py
      - step: ObjectsDepsCMakeGenerator
        module: yanga.cmake.objects_deps
      - step: TargetsDataCMakeGenerator
        module: yanga.cmake.targets_data
      - step: ReportCMakeGenerator
        module: yanga.cmake.reports
    pipeline:
      - include: pipeline/zephyr.yaml
      - step: ZephyrBuild
        file: platforms/zephyr/steps.py
        config: *zephyr_sim_config

  - name: zephyr_esp32h2
    description: Zephyr on the ESP32-H2 devkit, riscv64-zephyr-elf from poks
    # Zephyr's own Kconfig tree is the platform's feature model, opened by Zephyr's editor
    # (yanga's KConfigEdit cannot load it). The variant's selection for this platform is the
    # file the editor's changes are written into, and a build merges it as an EXTRA_CONF_FILE.
    feature_model:
      description: Zephyr options for zephyr_esp32h2
      file: KConfig
      pipeline:
        - include: pipeline/zephyr.yaml
        - step: ZephyrFeatures
          file: platforms/zephyr/steps.py
          # The editor configures the same build as ZephyrBuild, so it needs the same board
          # and toolchain; the anchor keeps them from drifting apart.
          config: &zephyr_esp32h2_config
            board: esp32h2_devkitm/esp32h2
            toolchain: cross-compile
            toolchain_app: riscv64-zephyr-elf
            # Zephyr's sysroot detection composes a doubled path when a toolchain
            # ships more than one libc; naming it skips that code. Relative to the toolchain.
            sysroot: picolibc/riscv64-zephyr-elf
    build_targets: [all, flash, report]
    components: [platform_types, zephyr_adapters, zephyr_led_ws2812]
    configs:
      - id: west
        file: platforms/zephyr/west.yaml
      - id: poks
        file: platforms/zephyr/poks.json
      # Included by the root CMakeLists.txt before project(): find_package(Zephyr).
      - id: vars
        content:
          PLATFORM_CMAKE_SETUP: platforms/zephyr/zephyr.cmake
      # Included at the end of variant.cmake: the adapters and Zephyr-side settings.
      - id: cmake
        file: platforms/zephyr/app.cmake
    generators:
      - step: ZephyrCMakeGenerator
        file: platforms/zephyr/steps.py
      - step: ObjectsDepsCMakeGenerator
        module: yanga.cmake.objects_deps
      - step: TargetsDataCMakeGenerator
        module: yanga.cmake.targets_data
      - step: ReportCMakeGenerator
        module: yanga.cmake.reports
    pipeline:
      - include: pipeline/zephyr.yaml
      # Espressif ships the radio firmware as binary blobs kept out of git. The
      # regex narrows 54 blobs to the 4 for this SoC.
      - step: FetchEspressifBlobs
        run: west blobs fetch hal_espressif --allow-regex lib/esp32h2/
      - step: ZephyrBuild
        file: platforms/zephyr/steps.py
        config: *zephyr_esp32h2_config
