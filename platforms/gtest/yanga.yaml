platforms:
  # Execute tests with GoogleTest framework
  - name: gtest
    description: Build and run components GTest tests
    build_targets:
      generic: [report, coverage, lint]
      variant: [all]
    generators:
      - step: GTestCMakeGenerator
        module: yanga.cmake.gtest
        config:
            mocking:
              enabled: true
              strict: false
              exclude_symbol_patterns:
                - "_*"
      #- step: CppCheckCMakeGenerator
      #  module: yanga.cmake.cppcheck
      - step: SphinxTestReportCMakeGenerator
        module: yanga.cmake.sphinx_test_report
      - step: TargetsDataCMakeGenerator
        module: yanga.cmake.targets_data
      - step: ReportCMakeGenerator
        module: yanga.cmake.reports
    configs:
      - id: west
        content:
          manifest:
            remotes:
              - name: gtest
                url-base: https://github.com/google
            projects:
              - name: googletest
                remote: gtest
                revision: v1.17.0
                path: gtest
      - id: poks
        file: platforms/gtest/poks.json
      - id: toolchain
        file: "platforms/gtest/gcc.cmake"
