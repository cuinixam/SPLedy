[project]
name = "spled"
version = "0.0.1"
description = "SPL demo project"
authors = [{ name = "Avengineers" }]
requires-python = "<4.0,>=3.11"

dependencies = [
    "yanga[zephyr]>=2.40,<3",
    "pytest>=8,<9",
    "myst-parser>=4.0,<5",
    "pypeline-semantic-release>=0.4.1,<0.5.0",
    "sphinx-rtd-theme>=2.0,<3",
    "sphinxcontrib-mermaid>=0.9,<1",
    "sphinx-needs>=2.0,<3",
    "sphinx-test-reports>=1.0,<2",
    "sphinx-rtd-size>=0.2,<1",
    "sphinxcontrib-plantuml>=0.29,<1",
    # The ESP32 flashing tool. Zephyr's own Python needs come with yanga[zephyr].
    "esptool>=5.2.0",
]

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 180

[tool.yanga]
create_yanga_build_dir = true
exclude_dirs = [".yanga"]

[tool.pytest.ini_options]
pythonpath = ["test", "platforms/pc_gui"]
testpaths = ["test"]
junit_logging = "all"
addopts = [
    "--capture=tee-sys",
    "-vv"
]
markers = [
    "just_a_try: mark a test as a try",
    "unittests: tests of individual units of code",
    "report: tests of the report generation",
    "build: tests of the target builds",
    "static_analysis: tests of static code analysis"
]
