variants:
- name: Disco
  description: The LED blinks and one can change the blinking frequency
  components:
  - rte
  - spled
  - power_signal_processing
  - light_controller
  - power_button
  - main_control_knob
  feature_selection:
    file: variants/Disco/config.txt
  platforms:
    gtest:
      components: [test_integrations_spled]
    arduino_uno_r3:
      components: [arduino_button, arduino_led]
    tc375:
      components: [tc375_button, tc375_led]
    zephyr_esp32h2:
      feature_selection:
        description: Disco's Zephyr options on the ESP32-H2
        file: variants/Disco/zephyr_esp32h2.txt
