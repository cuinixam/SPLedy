# Shared by the Zephyr platforms. Each platform appends its own ZephyrBuild step,
# which is where the board lives. No `gen` stage: Zephyr solves Kconfig itself.
pipeline:
  - include:
      file: bootstrap.yaml
      steps: [CreateVEnv, PoksInstall]
  # Zephyr gets a workspace of its own rather than the shared one under .yanga/ext:
  # a west workspace has exactly one manifest, and the shared one takes whichever
  # platform ran last. Zephyr's extension commands (west build, flash, blobs) and
  # its module discovery (hal_espressif) both read the workspace manifest.
  - step: WestInstall
    module: yanga_core.steps.west_install
    config:
      workspace_dir: .yanga/zephyr
      revision_scoped_paths: true
  # Must come before the env setup script, which bakes the context's variables into it.
  - step: ZephyrSetup
    module: yanga.zephyr.steps
  - step: GenerateEnvSetupScript
    module: pypeline.steps.env_setup_script
  # The product feature model is Zephyr-independent: its header comes from the same step as on
  # every other platform, and Zephyr's Kconfig no longer sees the product's symbols.
  - step: KConfigGen
    module: yanga_core.steps.kconfig_gen
  - step: GenerateBuildSystemFiles
    module: yanga.cmake.steps
  # Reads what the generators registered, so it comes after GenerateBuildSystemFiles.
  - step: GenerateReportConfig
    module: yanga_core.steps.generate_report_config
